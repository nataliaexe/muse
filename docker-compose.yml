version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: muse_postgres
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse_dev_2024
      POSTGRES_DB: muse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: muse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: muse_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://muse:muse_dev_2024@postgres:5432/muse_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile.dev
    container_name: muse_worker
    environment:
      DATABASE_URL: postgresql://muse:muse_dev_2024@postgres:5432/muse_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python worker.py

volumes:
  postgres_data:
  redis_data:
